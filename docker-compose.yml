services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      # LLM (OpenAI-совместимый API)
      AI_MODEL: ${AI_MODEL:-openai:gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CRITIC_MODEL: ${CRITIC_MODEL:-}
      # Документация
      DOCS_ROOT: /app/docs
      # Ограничения контекстного окна
      CONTEXT_TOKEN_LIMIT: ${CONTEXT_TOKEN_LIMIT:-120000}
      READ_TOKEN_BUDGET: ${READ_TOKEN_BUDGET:-20000}
    env_file:
      - path: .env
        required: false
    volumes:
      # Документация только для чтения
      - ./docs:/app/docs:ro
      # БД чатов сохраняется между перезапусками
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
