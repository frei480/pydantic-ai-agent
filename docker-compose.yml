services:
  backend:
    build: ./backend
    ports:
      # Только localhost: мимо nginx (и доменного входа) бэкенд не обходят,
      # отладка — по SSH-туннелю (решение заказчика).
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    environment:
      # LLM (OpenAI-совместимый API)
      AI_MODEL: ${AI_MODEL:-openai:gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CRITIC_MODEL: ${CRITIC_MODEL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Доменный вход (Kerberos SSO): режим, админы, keytab и SPN — из .env
      AUTH_MODE: ${AUTH_MODE:-auto}
      ADMIN_USERS: ${ADMIN_USERS:-}
      KRB5_KTNAME: ${KRB5_KTNAME:-}
      KRB5_PRINCIPAL: ${KRB5_PRINCIPAL:-}
      # Документация
      DOCS_ROOT: /app/docs
      # Установленные примеры T-FLEX DOCs API
      API_EXAMPLES_ROOT: /app/api-examples
      # Ограничения контекстного окна
      CONTEXT_TOKEN_LIMIT: ${CONTEXT_TOKEN_LIMIT:-120000}
      READ_TOKEN_BUDGET: ${READ_TOKEN_BUDGET:-20000}
    env_file:
      - path: .env
        required: false
    volumes:
      # Документация только для чтения
      - ./docs:/app/docs:ro
      # Примеры API доступны агенту только для чтения
      - type: bind
        source: ${DOCS_API_EXAMPLES_PATH:-./api-examples}
        target: /app/api-examples
        read_only: true
        bind:
          create_host_path: false
      # БД чатов сохраняется между перезапусками
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
